# 4-bit palettization, group_size 8, for granite-4.2-3b iOS.
# group_size 8, not the 32 of DEFAULT_IOS_COMPRESSION_PRESET: group32 is the recipe that
# destroyed Menlo/Lucy (helper/docs/coreai.md Rule 2b) and Apple's own iOS preset for
# Qwen2.5-1.5B is "4bit_weight_palettized_group8". Fragility is checkpoint-specific and is
# NOT structurally detectable, so this must be judged by reading decoded text -- coreai-run
# and CoreAIProbe, against the shipped bundles on the same prompts.
# If it fails the text check the next step is 6-bit g8 (see models/smollm2/smollm2_1_7b_6bit.yaml),
# not a jump to full 8-bit.
# wangqi modified 2026-09-16
kmeans_palettization_config:
  global_config:
    op_state_spec:
      weight:
        n_bits: 4
        granularity:
          type: per_grouped_channel
          axis: 0
          group_size: 8
  module_type_configs:
    torch.nn.modules.sparse.Embedding: null
    coreai_models.primitives.ios.embedding.LoadEmbeddings: null
